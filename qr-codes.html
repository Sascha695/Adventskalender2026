<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR-Codes</title><link rel="stylesheet" href="style.css"><style>@media print{header,footer,.no-print{display:none}.qr-grid{grid-template-columns:repeat(4,1fr)}.qr-card{break-inside:avoid}}.qr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.qr-card{background:white;border:1px solid #ddd;border-radius:12px;text-align:center;padding:10px}.qr-card img{width:150px;height:150px}@media(max-width:700px){.qr-grid{grid-template-columns:repeat(2,1fr)}}@media print{.qr-card img{width:38mm;height:38mm}}</style></head><body><main class="puzzle-shell"><article class="puzzle-card"><div class="no-print"><a class="back" href="index.html">← Zum Kalender</a><h1>QR-Codes zum Ausdrucken</h1><button class="btn" onclick="window.print()">Drucken</button></div><div id="qrGrid" class="qr-grid"></div></article></main><script>const base=location.href.replace(/qr-codes\.html.*$/,'');for(let d=1;d<=24;d++){const url=base+'day'+d+'.html',encoded=encodeURIComponent(url),card=document.createElement('div');card.className='qr-card';card.innerHTML=`<strong>Tag ${d}</strong><br><img src="https://api.qrserver.com/v1/create-qr-code/?data=${encoded}&size=300x300" alt="QR-Code für Tag ${d}">`;document.getElementById('qrGrid').appendChild(card)}</script></body></html>
