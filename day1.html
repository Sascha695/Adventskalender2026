<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wichtelprüfung 1</title><link rel="stylesheet" href="style.css"></head><body><div class="snow"></div><main class="puzzle-shell"><article class="puzzle-card"><a class="back" href="index.html">← Zum Kalender</a><h1 id="dayTitle"></h1><div id="storyText"></div><div id="miniElf" style="max-height:260px"></div><h2>Richte deinen Wichtel für die Schule ein</h2><div class="options-grid"><label>Name<br><input id="elfName" value="Wichtel"></label><label>Hut<select id="elfHat"><option>Red</option><option>Green</option><option>Blue</option><option>Gold</option></select></label><label>Jacke<select id="elfCoat"><option>Green</option><option>Red</option><option>Blue</option><option>Gold</option></select></label><label>Hose<select id="elfPants"><option>Blue</option><option>Red</option><option>Green</option><option>Gold</option></select></label><label>Haare<select id="elfHair"><option>Blond</option><option>Brown</option><option>Red</option><option>Black</option></select></label><label>Accessoire<select id="elfAccessory"><option>Schal</option><option>Brille</option><option>Rucksack</option><option>Glocke</option></select></label></div><div class="controls"><button class="btn" id="saveElf">Wichtel für alle Tage speichern</button></div><div id="letterBox" class="letter-box"><p>Dein Prüfungsbuchstabe</p><div class="letter" id="letter">W</div></div></article></main><script src="app.js"></script><script>initDay(1);const o=getOutfit();document.getElementById('elfName').value=o.name;for(const [id,key] of [['elfHat','hat'],['elfCoat','coat'],['elfPants','pants'],['elfHair','hair'],['elfAccessory','accessory']]){const el=document.getElementById(id);el.value=o[key]}document.getElementById('saveElf').onclick=()=>{saveOutfit({name:document.getElementById('elfName').value.trim()||'Wichtel',hat:document.getElementById('elfHat').value,coat:document.getElementById('elfCoat').value,pants:document.getElementById('elfPants').value,hair:document.getElementById('elfHair').value,accessory:document.getElementById('elfAccessory').value});finishDay(1,'W','Uniform und Ausstattung gespeichert!');document.getElementById('miniElf').innerHTML=elfHTML()}</script></body></html>
